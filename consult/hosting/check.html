<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>澄室接口检测</title>
    <style>
      body { font: 16px/1.6 sans-serif; background: #111827; color: #f9fafb; padding: 24px; }
      pre { white-space: pre-wrap; background: #0b1220; padding: 16px; border-radius: 8px; }
      .ok { color: #34d399; }
      .fail { color: #f87171; }
    </style>
  </head>
  <body>
    <h1>澄室接口检测</h1>
    <p>打开本页后应看到 <code>ok: true</code>。若失败，检查网站是否启用 PHP，以及 <code>data</code> 目录是否可写（chmod 777）。</p>
    <p id="status">检测中…</p>
    <pre id="out"></pre>
    <script>
      function show(ok, text, extra) {
        document.getElementById('out').textContent = extra ? extra + '\n\n' + text : text
        document.getElementById('status').className = ok ? 'ok' : 'fail'
        document.getElementById('status').textContent = ok
          ? '接口正常，可以打开首页测试。'
          : '接口异常：' + (extra || '网站可能未启用 PHP，或 data 目录不可写。')
      }
      fetch('/api.php?act=health')
        .then(function (r) { return r.text().then(function (t) { return { ok: r.ok, t: t } }) })
        .then(function (res) {
          try {
            var start = res.t.indexOf('{')
            var j = JSON.parse(start >= 0 ? res.t.slice(start) : res.t)
            if (j.ok && j.data_writable === false) {
              show(false, res.t, 'data 目录不可写，请执行 chmod -R 777 data')
              return
            }
            if (j.ok) {
              show(true, res.t)
              return
            }
          } catch (e) {}
          show(false, res.t)
        })
        .catch(function (e) {
          show(false, String(e))
        })
    </script>
  </body>
</html>
