<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
    <meta name="format-detection" content="telephone=no" />
    <title>澄室 · 情感咨询</title>
    <meta name="description" content="澄室提供一对一情感咨询。写下你的心事，由咨询师给出结构化回应。服务仅供自我觉察参考。" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,480;9..144,600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        try {
          var src = location.search
          if (location.hash.indexOf('=') >= 0) src += '&' + location.hash.replace(/^#/, '')
          var match = /(?:^|[?&#])callback=([^&]+)/i.exec(src)
          if (!match) return
          var cb = decodeURIComponent(match[1].replace(/\+/g, ' '))
          if (!cb || /^__/.test(cb)) return
          document.cookie = 'clarum_cb=' + encodeURIComponent(cb) + ';path=/;max-age=86400;SameSite=Lax'
          sessionStorage.setItem('clarum_ks_click', cb)
        } catch (e) {}
      })()
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
